      description: Price is read from the course, never from the request. Creates the cart if needed.
      security:
      - {}
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/CartKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              properties:
                slug:
                  type: string
                  maxLength: 255
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
      responses:
        '200':
          description: Updated cart. (A JsonResource around a model saved earlier in the request; Laravel may answer 201 when
            the cart row was created in this request — status depends on `wasRecentlyCreated`,)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '201':
          description: Same body, when the cart was created by this request.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
