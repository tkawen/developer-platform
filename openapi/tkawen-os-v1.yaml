  /checkout:
    post:
      operationId: createCheckoutOrder
      tags:
      - Commerce
      summary: Turn the open cart into a pending order (prices and coupon recomputed server-side).
      description: 'Uses the caller''s open cart; if none, claims an open guest cart by `X-Cart-Key` (or the cart cookie).

        Coupon: active coupon by code; `percent` or fixed amount (value × 100 minor units, capped at subtotal).

        Unknown coupon codes are ignored silently.'
      security:
      - sanctumToken: []
      x-rate-limit: api-v1
      x-known-defect: Known server defect; a fix is pending deployment.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                coupon:
                  type:
                  - string
                  - 'null'
                  maxLength: 64
      responses:
        '201':
          description: Pending order with items.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No open cart (message «لا توجد سلّة مفتوحة.»), or a cart line's course no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: Cart is empty (`abort(422, "The cart is empty.")`) or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders/{number}/pay:
    post:
      operationId: settleFreeOrder
      tags:
      - Commerce
      summary: Settle the caller's own zero-total order (issues invoice, enrols, converts cart).
      description: Orders with total_minor > 0 are refused with 402 — those are settled by the gateway or by receipt verification.
        Dispatches the `order.paid` webhook.
      security:
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
        description: Order number.
      responses:
        '200':
          description: Paid order with items and invoice.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: Order has a price; the buyer cannot settle it here.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - requires_payment
                - total_minor
                properties:
                  error:
                    type: string
                  requires_payment:
                    type: boolean
                    const: true
                  total_minor:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
              example:
                message: This order is already paid.
        '429':
          $ref: '#/components/responses/TooManyRequests'
