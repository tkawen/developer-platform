      description: 'Signed-in (bearer token resolved on sanctum) → cart by user. Guest → cart by `X-Cart-Key` header,

        else `tkawen_cart_key` cookie, else a freshly minted key set as that cookie (30 days, HttpOnly, Lax).

        When no cart exists an unsaved empty cart is returned.'
      security:
      - {}
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/CartKey'
      responses:
        '200':
          description: Cart (JsonResource, wrapped).
