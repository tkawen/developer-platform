                properties:
                  data:
                    type: object
                    required:
                    - saved
                    properties:
                      saved:
                        type: boolean
                        const: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /dashboard/metrics:
    get:
      operationId: getInstitutionMetrics
      tags:
      - Staff
      summary: Pre-aggregated revenue/enrolment metrics for a date range (staff only).
      description: Academy staff only.
      security:
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Default today minus 29 days.
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Default today.
      - name: currency
        in: query
        schema:
          type: string
          minLength: 3
          maxLength: 3
          default: DZD
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionMetrics'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not staff (`هذه اللوحة لطاقم المعهد فقط.`) or banned (`الحساب موقوف.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verify/{code}:
    get:
      operationId: verifyCertificate
      tags:
      - Certificates
      summary: Verify a certificate by certificate code or credential UID. Every attempt is logged.
      description: Runs under its own limiter `api-v1-verify` only (not `api-v1`), and without the lazy-loading guard.
      security: []
      x-rate-limit: api-v1-verify
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: certificate_code or credential_uid (trimmed).
      responses:
        '200':
          description: Certificate found; `status` is the verdict (a revoked or tampered certificate is still 200).
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - credential_uid
                - issued_at
                - student_name
                - course_title
                properties:
                  status:
                    $ref: '#/components/schemas/CertificateStatus'
                  credential_uid:
                    type: string
                  issued_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  student_name:
                    type:
                    - string
                    - 'null'
                  course_title:
                    type:
                    - string
                    - 'null'
        '404':
          description: No such certificate.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: not_found
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sanctumToken:
      type: http
      scheme: bearer
      description: 'Laravel Sanctum personal access token (`Authorization: Bearer <id>|<token>`), tenant-scoped.

        Issued by legacy unversioned routes (e.g. `POST /api/auth/login`), not by /api/v1.

        No expiry is configured (no ; tokens created without expires_at).'
  parameters:
    CourseSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Course slug.
    LessonSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Lesson slug.
    RequestPublicId:
      name: publicId
      in: path
      required: true
      schema:
        type: string
      description: Student request public id. Format not constrained by the route.
    CartKey:
      name: X-Cart-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      description: Guest cart key (truncated to 64 chars). Falls back to the `tkawen_cart_key` cookie.
  responses:
    Unauthenticated:
      description: No or invalid bearer token (Laravel AuthenticationException rendered as JSON; `api/*` always gets JSON).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageError'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Policy refused (Gate::authorize → AuthorizationException).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageError'
    NotFound:
      description: Model not found, or deliberately hidden (no enrolment / not addressable). Framework JSON error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageError'
    ValidationFailed:
      description: Laravel validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    LessonLocked:
      description: The sequential/drip/access gate refused this lesson (LessonGate::deny).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LessonLockedError'
    TooManyRequests:
      description: Rate limit hit. Rendered by  for `api/*`; the Arabic message states the wait (seconds, or minutes when
        >= 90 s).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until retry (also carried as `retry_after`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
          example:
            message: محاولات كثيرة في وقت قصير. انتظر 42 ثانية ثم أعد المحاولة.
            retry_after: 42
  schemas:
    MessageError:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ErrorField:
      type: object
      required:
      - error
      description: Controller-level error envelope used by some v1 handlers (different from `message`).
      properties:
        error:
          type: string
    ValidationError:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LessonLockedError:
      type: object
      required:
      - message
      - error
      - needs
      - needs_slug
      properties:
        message:
          type: string
          description: Arabic reason.
        error:
          type: string
          const: lesson_locked
        needs:
          type:
          - string
          - 'null'
          description: Title of the lesson that must be completed/passed first.
        needs_slug:
          type:
          - string
          - 'null'
    TooManyRequestsError:
      type: object
      required:
      - message
      - retry_after
      properties:
        message:
          type: string
        retry_after:
          type: integer
          description: Seconds (defaults to 60 if the header is missing).
    PaginationLinks:
      type: object
