name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [verify, os-sdk, os-mcp]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build os-sdk first (os-mcp depends on it)
        if: matrix.package == 'os-mcp'
        working-directory: packages/os-sdk
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @redocly/cli lint openapi/tkawen-os-v1.yaml
