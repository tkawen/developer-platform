openapi: 3.1.0
info:
  title: TKAWEN OS Tenant API
  version: '1'
  summary: Tenant-scoped learner, catalogue and commerce API of a TKAWEN OS academy.
  description: 'Derived from the TKAWEN OS kernel source.

    Nothing here is taken from product documents.


    **Tenant**: the academy is identified by the host (`InitializeTenancyBySubdomain`) and the

    same routes refuse the central domain (`PreventAccessFromCentralDomains`).


    **Envelopes are not uniform.** Laravel `JsonResource` responses are wrapped in `{"data": ...}`

    (no `withoutWrapping()` anywhere in the kernel); many controllers return a hand-built

    `response()->json(...)` with their own top-level keys. Each operation documents the actual shape.


    **Errors are not uniform either.** Framework errors use `{"message": ...}` (+ `errors` for 422);

    several controllers return `{"error": ...}`; the lesson gate returns `{"message","error":"lesson_locked",...}`

    with HTTP 423; certificate verification returns `{"status":"not_found"}`.


    **Nullability.** A field is marked nullable where the code produces `null` explicitly. Fields passed

    through straight from a database column are typed from the model cast; whether the column itself

    may be null is not asserted here.


    **Rate limits** (`x-rate-limit`): every route except `/verify/{code}` runs under the named limiter

    `api-v1` (120/min keyed by user id when `$request->user()` resolves, otherwise 60/min keyed by IP).

    `/verify/{code}` runs under `api-v1-verify` only (10/min and 300/day per IP). Some routes add a

    per-route limiter `throttle:N,M,prefix` (alias `ThrottlePerRoute`: N attempts per M minutes, keyed by

    user-or-IP + method + route URI).'
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://{academy}.tkawen.com/api/v1
  description: Tenant host. The academy subdomain selects the tenant database.
  variables:
    academy:
      default: demo
      description: The academy's subdomain on tkawen.com (tenant identified by host).
tags:
- name: Catalogue
  description: Public course catalogue, instructors, reviews, sitemap.
- name: Auth
  description: Sign-in methods available on this academy.
- name: Learning
  description: Lesson room, captions, progress, discussion, assignments, locks, transcript.
- name: Commerce
  description: Cart, checkout, orders, payment methods and payments.
- name: Me
  description: The signed-in learner's own rows.
- name: Wishlist
  description: The learner's saved courses, instructors and bundles.
- name: Requests
  description: The learner's requests to the academy.
- name: Certificates
  description: Public certificate verification.
- name: Staff
  description: Academy staff (tenant_admin, instructor, super_admin).
security: []
paths:
  /courses:
    get:
      operationId: listCourses
      tags:
      - Catalogue
      summary: List published courses (paginated, filterable, Arabic-aware search).
      description: 'Only `status = published`. Unknown filter values are ignored, not refused.

        Default order: `published_at` desc, then `id` desc (also the tie-breaker of other sorts).

        When `q` is given, the published set is scored in PHP and ranked by score (sort is ignored in that case

        except as the pre-order of the candidate set).'
      security: []
      x-rate-limit: api-v1
      parameters:
      - name: category
        in: query
        schema:
          type: string
        description: Exact category match.
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/CourseLevel'
      - name: language
        in: query
        schema:
          type: string
          enum:
          - ar
          - fr
          - en
      - name: price
        in: query
        schema:
          type: string
          enum:
          - free
          - paid
        description: 'free: price <= 0, paid: price > 0.'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - popular
          - price_asc
          - price_desc
          default: newest
        description: popular = enrollments_count desc. Any other value = newest.
      - name: q
        in: query
        schema:
          type: string
        description: Arabic-aware search over title, short_description, category and tags.
      - name: per_page
        in: query
        schema:
          type: integer
          default: 12
          maximum: 50
        description: Capped at 50 (min(per_page, 50)); no lower bound in code.
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      responses:
        '200':
          description: Paginated course collection.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - links
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /courses/{slug}:
    get:
      operationId: getCourse
      tags:
      - Catalogue
      summary: One published course with its modules, lessons, prerequisites and rating.
      security: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/CourseSlug'
      responses:
        '200':
          description: The course (JsonResource, wrapped). Includes `modules` and `prerequisites`.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /courses/{slug}/related:
    get:
      operationId: listRelatedCourses
      tags:
      - Catalogue
      summary: Up to three other published courses, same category first, then newest.
      security: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/CourseSlug'
      responses:
        '200':
          description: Related courses (not paginated).
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /courses/{slug}/reviews:
    get:
      operationId: listCourseReviews
      tags:
      - Catalogue
      summary: Approved reviews of a published course, with average and distribution.
      security: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/CourseSlug'
      - name: per_page
        in: query
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 30
        description: Clamped to 1..30.
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Reviews page (hand-built envelope; not the Laravel paginator shape).
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicReview'
                  meta:
                    type: object
                    required:
                    - average
                    - total
                    - distribution
                    - current_page
                    - last_page
                    properties:
                      average:
                        type:
                        - number
                        - 'null'
                        description: Rounded to 1 decimal; null when no approved review.
                      total:
                        type: integer
                      distribution:
                        type: object
                        description: Count of approved reviews per star, keys "5".."1".
                        properties:
                          '5':
                            type: integer
                          '4':
                            type: integer
                          '3':
                            type: integer
                          '2':
                            type: integer
                          '1':
                            type: integer
                      current_page:
                        type: integer
                      last_page:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: submitCourseReview
      tags:
      - Catalogue
      summary: Create or replace the caller's review (goes back to pending approval).
      description: 'Requires an `active` or `completed` enrolment in this course. Upsert on (course, user);

        every write sets `is_approved = false`. Comment is stripped of tags and trimmed; empty becomes null.'
      security:
      - sanctumToken: []
      x-rate-limit:
      - api-v1
      - throttle:6,1,post-courses-slug-reviews (6 per 1 minute)
      parameters:
      - $ref: '#/components/parameters/CourseSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type:
                  - string
                  - 'null'
                  maxLength: 2000
      responses:
        '201':
          description: Stored, pending approval.
          content:
            application/json:
              schema:
                type: object
                required:
                - review
                - message
                properties:
                  review:
                    $ref: '#/components/schemas/MyReview'
                  message:
                    type: string
                    description: Arabic confirmation text.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Caller has no active/completed enrolment in this course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
              example:
                message: التقييم متاح للمسجّلين في هذا البرنامج فقط.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /courses/{slug}/reviews/mine:
    get:
      operationId: getMyCourseReview
      tags:
      - Catalogue
      summary: Whether the caller may review this course, and their existing review.
      security:
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/CourseSlug'
      responses:
        '200':
          description: Eligibility and review.
          content:
            application/json:
              schema:
                type: object
                required:
                - eligible
                - review
                properties:
                  eligible:
                    type: boolean
                    description: Has an active or completed enrolment.
                  review:
                    oneOf:
                    - $ref: '#/components/schemas/MyReview'
                    - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /courses/{slug}/locks:
    get:
      operationId: getCourseLocks
      tags:
      - Learning
      summary: Lock state and completion of every lesson for the caller's own enrolment.
      description: The course is looked up by slug without a published filter. 404 when the caller has no enrolment in it.
      security:
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/CourseSlug'
      responses:
        '200':
          description: Locks keyed by lesson slug, in gate order.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - progress
                - enrollment
                properties:
                  data:
                    type: object
                    description: Map lesson slug -> lock.
                    additionalProperties:
                      $ref: '#/components/schemas/LessonLock'
                  progress:
                    type: object
                    required:
                    - done
                    - total
                    - percent
                    properties:
                      done:
                        type: integer
                      total:
                        type: integer
                      percent:
                        type: integer
                  enrollment:
                    type: object
                    required:
                    - status
                    - active
                    properties:
                      status:
                        $ref: '#/components/schemas/EnrollmentStatus'
                      active:
                        type: boolean
                        description: True when status is active or completed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /instructors:
    get:
      operationId: listInstructors
      tags:
      - Catalogue
      summary: Faculty directory — instructors/admins teaching at least one published course.
      security: []
      x-rate-limit: api-v1
      responses:
        '200':
          description: Ordered by name. Not paginated.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - public_id
                      - name
                      - bio
                      - avatar
                      - courses_count
                      - categories
                      properties:
                        public_id:
                          type: string
                        name:
                          type: string
                        bio:
                          type:
                          - string
                          - 'null'
                        avatar:
                          type:
                          - string
                          - 'null'
                          description: Stored value, not made absolute.
                        courses_count:
                          type: integer
                        categories:
                          type: array
                          items:
                            type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /instructors/{publicId}:
    get:
      operationId: getInstructor
      tags:
      - Catalogue
      summary: Public instructor profile and their published courses.
      description: Only users with role instructor or tenant_admin and not banned; anyone else is 404.
      security: []
      x-rate-limit: api-v1
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Profile (hand-built, not wrapped in data).
          content:
            application/json:
              schema:
                type: object
                required:
                - public_id
                - name
                - bio
                - avatar
                - courses_count
                - lessons_count
                - courses
                properties:
                  public_id:
                    type: string
                  name:
                    type: string
                  bio:
                    type:
                    - string
                    - 'null'
                  avatar:
                    type:
                    - string
                    - 'null'
                  courses_count:
                    type: integer
                  lessons_count:
                    type: integer
                  courses:
                    type: array
                    description: CourseResource items, ordered by id desc (no rating block, no modules).
                    items:
                      $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/facets:
    get:
      operationId: getCatalogueFacets
      tags:
      - Catalogue
      summary: Filter values with counts, derived from the published set.
      security: []
      x-rate-limit: api-v1
      responses:
        '200':
          description: Facets.
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - categories
                - levels
                - languages
                - price
                properties:
                  total:
                    type: integer
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacetValue'
                  levels:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacetValue'
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacetValue'
                  price:
                    type: object
                    required:
                    - free
                    - paid
                    properties:
                      free:
                        type: integer
                      paid:
                        type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sitemap:
    get:
      operationId: getSitemapFeed
      tags:
      - Catalogue
      summary: Data for the client's /sitemap.xml.
      security: []
      x-rate-limit: api-v1
      responses:
        '200':
          description: Published courses, teaching instructors, published pages, and whether active plans exist.
          content:
            application/json:
              schema:
                type: object
                required:
                - courses
                - instructors
                - pages
                - has_plans
                properties:
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        updated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                  instructors:
                    type: array
                    items:
                      type: object
                      properties:
                        public_id:
                          type: string
                        updated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        updated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                  has_plans:
                    type: boolean
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/providers:
    get:
      operationId: listAuthProviders
      tags:
      - Auth
      summary: Sign-in methods actually wired on this academy.
      description: 'This API does not issue tokens. Tokens are minted by the legacy unversioned routes

        (e.g. `POST /api/auth/login` on the tenant host) — outside /api/v1.'
      security: []
      x-rate-limit: api-v1
      responses:
        '200':
          description: Providers.
          content:
            application/json:
              schema:
                type: object
                required:
                - providers
                - password
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - label
                      - url
                      - kind
                      properties:
                        id:
                          type: string
                          enum:
                          - tkawen
                          - google
                          - facebook
                          - github
                        label:
                          type: string
                        url:
                          type: string
                          description: Relative URL of the redirect route.
                        kind:
                          type: string
                          enum:
                          - oidc
                          - oauth
                  password:
                    type: boolean
                    const: true
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lessons/{slug}:
    get:
      operationId: getLesson
      tags:
      - Learning
      summary: The lesson room payload (content, signed media URLs, progress).
      description: 'Public route with optional bearer token (resolved on the `sanctum` guard). A lesson that is neither

        `is_preview` nor `is_free` is 404 without an enrolment (404, not 403, by design). An enrolled caller

        may get 423 from the sequential gate. Signed asset URLs live 300 s (`expires_in`).

        Note: the course''s publication status is not checked by this handler.'
      security:
      - {}
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/LessonSlug'
      responses:
        '200':
          description: Lesson.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/LessonLocked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lessons/{slug}/captions:
    get:
      operationId: getLessonCaptions
      tags:
      - Learning
      summary: Caption cues of a lesson, with in-video search.
      description: 'Door: `is_preview` lesson or an enrolment (else 404), then the sequential gate (423).

        Unlike getLesson, `is_free` alone does not open this route (uses `Lesson::isOpenPreview()` = is_preview).'
      security:
      - {}
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/LessonSlug'
      - name: q
        in: query
        schema:
          type: string
        description: Arabic-aware search over cue text.
      responses:
        '200':
          description: Cues. When no caption asset exists, `available` is false and `q` is absent.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - available
                    - cues
                    - hits
                    properties:
                      available:
                        type: boolean
                      cues:
                        type: array
                        items:
                          type: object
                          properties:
                            start:
                              type: number
                              description: Seconds.
                            end:
                              type: number
                              description: Seconds.
                            text:
                              type: string
                      hits:
                        type: array
                        items:
                          type: object
                          properties:
                            i:
                              type: integer
                              description: Cue index.
                            t:
                              type: integer
                              description: Second to seek to (floor of start).
                            text:
                              type: string
                      q:
                        type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/LessonLocked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lessons/{slug}/progress:
    post:
      operationId: recordLessonProgress
      tags:
      - Learning
      summary: The 30-second watch ping — accumulates watch time, stores position, may complete the lesson.
      description: '`seconds` is capped server-side at 60 per ping. `completed` is ignored for lessons that complete

        only by result (quiz with questions, assignment, SCORM). Completion also requires the lesson''s

        `required_watch_pct` of its duration to have been accumulated.'
      security:
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/LessonSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - seconds
              properties:
                seconds:
                  type: integer
                  minimum: 0
                  maximum: 3600
                position:
                  type: integer
                  minimum: 0
                completed:
                  type: boolean
      responses:
        '200':
          description: Progress after this ping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressPingResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          $ref: '#/components/responses/LessonLocked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lessons/{slug}/discussion:
    get:
      operationId: listLessonDiscussion
      tags:
      - Learning
      summary: Question threads under a lesson (enrolled learners and course staff).
      security:
      - sanctumToken: []
      x-rate-limit: api-v1
      parameters:
      - $ref: '#/components/parameters/LessonSlug'
      responses:
        '200':
          description: Threads, newest first.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - can_post
                - is_staff
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscussionThread'
                  can_post:
                    type: boolean
                    const: true
                  is_staff:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: postLessonDiscussion
      tags:
      - Learning
      summary: Ask a question, or reply to a top-level thread.
      description: A new question notifies the course instructor (else the tenant admins); a reply notifies the thread author.
      security:
      - sanctumToken: []
      x-rate-limit:
      - api-v1
      - throttle:30,1,post-lessons-slug-discussion (30 per 1 minute)
      parameters:
      - $ref: '#/components/parameters/LessonSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  minLength: 2
                  maxLength: 4000
                parent_id:
                  type:
                  - integer
                  - 'null'
                  description: Id of a top-level comment on this lesson; otherwise 404.
      responses:
        '201':
          description: Created comment (as a thread row).
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DiscussionThread'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lessons/{slug}/assignment:
    post:
      operationId: submitLessonAssignment
      tags:
      - Learning
      summary: Hand in an assignment (text and/or file).
      description: 'Lesson must be of type `assignment` with an assignment attached, and the caller enrolled (else 404);

        then the sequential gate (423). Business rules (attempts, due date, text-only/file-only, file type,

        20 MB) are raised as 422 validation errors on keys `assignment`, `content` or `file`.'
      security:
      - sanctumToken: []
      x-rate-limit:
      - api-v1
